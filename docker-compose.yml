services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-hospedes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_hospedes
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - gestao-hospedes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d gestao_hospedes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestao-hospedes-db-data:
