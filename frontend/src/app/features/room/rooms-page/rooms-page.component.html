<header class="page-header">
  <h1>Quartos</h1>
</header>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Cadastrar quarto</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-room-form (roomCreated)="onRoomCreated($event)" />
  </mat-card-content>
</mat-card>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Quartos cadastrados</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-room-list [refreshSignal]="lastCreatedRoom" />
  </mat-card-content>
</mat-card>
