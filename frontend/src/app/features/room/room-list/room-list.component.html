@if (rooms.length === 0) {
  <p class="empty-state" data-testid="room-list-empty">Nenhum quarto cadastrado.</p>
}

@if (rooms.length > 0) {
  <table mat-table [dataSource]="rooms" class="data-table" data-testid="room-list-table">
    <ng-container matColumnDef="number">
      <th mat-header-cell *matHeaderCellDef>Número</th>
      <td mat-cell *matCellDef="let room">{{ room.number }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Categoria</th>
      <td mat-cell *matCellDef="let room">{{ room.category.name }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let room">
        <mat-select
          [value]="room.status"
          class="status-select"
          [ngClass]="'status-select-' + statusClass(room.status)"
          [attr.data-testid]="'room-status-select-' + room.id"
          (selectionChange)="changeStatus(room, $event.value)"
        >
          <mat-select-trigger>
            <span class="status-chip" [ngClass]="'status-chip-' + statusClass(room.status)">
              {{ statusLabel(room.status) }}
            </span>
          </mat-select-trigger>
          @for (status of statuses; track status) {
            <mat-option [value]="status">{{ statusLabel(status) }}</mat-option>
          }
        </mat-select>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
