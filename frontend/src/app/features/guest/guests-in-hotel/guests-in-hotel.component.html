<header class="page-header">
  <h1>Hóspedes no Hotel</h1>
</header>

<mat-card class="section-card">
  <mat-card-content>
    @if (guests.length === 0) {
      <p class="empty-state" data-testid="guests-in-hotel-empty">Nenhum hóspede hospedado no momento.</p>
    }

    @if (guests.length > 0) {
      <table mat-table [dataSource]="guests" class="data-table" data-testid="guests-in-hotel-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let guest">{{ guest.name }}</td>
        </ng-container>

        <ng-container matColumnDef="document">
          <th mat-header-cell *matHeaderCellDef>Documento</th>
          <td mat-cell *matCellDef="let guest">{{ guest.document }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let guest">{{ guest.phone }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
