<header class="page-header">
  <h1>Hóspedes</h1>
</header>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Cadastrar hóspede</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-guest-form (guestCreated)="onGuestCreated($event)" />
  </mat-card-content>
</mat-card>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Buscar hóspedes</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-guest-search [refreshSignal]="lastCreatedGuest" />
  </mat-card-content>
</mat-card>
