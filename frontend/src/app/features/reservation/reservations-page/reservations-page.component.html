<header class="page-header">
  <h1>Reservas</h1>
</header>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Criar reserva</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-reservation-form (reservationCreated)="onReservationCreated($event)" />

    @if (lastCreatedReservation) {
      <p class="success-message" data-testid="reservation-created-message">
        Reserva #{{ lastCreatedReservation.id }} criada para {{ lastCreatedReservation.guest.name }} no quarto
        {{ lastCreatedReservation.room.number }}.
      </p>
    }
  </mat-card-content>
</mat-card>
