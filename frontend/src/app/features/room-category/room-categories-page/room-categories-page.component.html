<header class="page-header">
  <h1>Categorias de Quarto</h1>
</header>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Cadastrar categoria</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-room-category-form (categoryCreated)="onCategoryCreated($event)" />
  </mat-card-content>
</mat-card>

<mat-card class="section-card">
  <mat-card-header>
    <mat-card-title>Configurar preço por dia da semana</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-room-category-price [refreshSignal]="lastCreatedCategory" />
  </mat-card-content>
</mat-card>
